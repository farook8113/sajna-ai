name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch: # Allows manual trigger on GitHub dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Gradle init script for jcenter bypass
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/init.gradle
          // Inject jcenter() method globally on the RepositoryHandler class to bypass deprecation errors
          org.gradle.api.artifacts.dsl.RepositoryHandler.metaClass.jcenter = { ->
              delegate.mavenCentral()
          }
          EOF

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build Production APK
        run: flutter build apk --release --no-pub
        working-directory: flutter_app

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sajna-AI-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

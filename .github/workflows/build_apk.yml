name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch: # Allows manual trigger on GitHub dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: sajna_ai/flutter_app

      - name: Build Production APK
        run: flutter build apk --release --no-pub
        working-directory: sajna_ai/flutter_app

      - name: Upload Release APK
        uses: actions/upload-artifact@v3
        with:
          name: Sajna-AI-Android-APK
          path: sajna_ai/flutter_app/build/app/outputs/flutter-apk/app-release.apk

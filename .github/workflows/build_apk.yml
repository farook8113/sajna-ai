name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch: # Allows manual trigger on GitHub dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android platform files from scratch
        run: |
          rm -rf android
          flutter create --platforms=android .
        working-directory: flutter_app

      - name: Apply Premium App Icon
        run: |
          cp web_simulator/icon-512.png flutter_app/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp web_simulator/icon-512.png flutter_app/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp web_simulator/icon-512.png flutter_app/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp web_simulator/icon-512.png flutter_app/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp web_simulator/icon-512.png flutter_app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app

      - name: Build Production APK
        run: flutter build apk --release --no-pub
        working-directory: flutter_app

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sajna-AI-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

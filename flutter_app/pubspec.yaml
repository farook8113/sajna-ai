name: sajna_ai
description: SAJNA AI - Offline-First Cabin Crew Assistant for Air Arabia.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3
  share_plus: ^9.0.0
  speech_to_text: ^6.6.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.5
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/app.css
    - assets/web/app.js
    - assets/web/index.html
    - assets/web/manifest.json
    - assets/web/icon-192.png
    - assets/web/icon-512.png
    - assets/web/material_symbols.woff2

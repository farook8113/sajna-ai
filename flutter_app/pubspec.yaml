name: sajna_ai
description: SAJNA AI - Offline-First Cabin Crew Assistant for Air Arabia.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  cupertino_icons: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/web/
    - assets/web/index.html
    - assets/web/app.css
    - assets/web/app.js
    - assets/web/manifest.json
    - assets/web/icon-192.png
    - assets/web/icon-512.png
